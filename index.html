<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saxophone Daily - 萨克斯每日基本功与指法训练</title>
  <!-- 引入矢量五线谱渲染库 ABCjs -->
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>
  <style>
    :root {
      --primary: #d97706;
      --primary-hover: #b45309;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --key-active: #f59e0b;
      --key-inactive: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .selector-group {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .btn-toggle {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--text-muted);
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-toggle.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 五线谱展示区 */
    #sheetMusicContainer {
      background: #ffffff;
      border-radius: 8px;
      padding: 10px 6px;
      margin: 12px 0;
      overflow-x: auto;
    }

    /* 萨克斯指法图示 */
    .fingering-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #111827;
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }
    .fingering-info {
      text-align: center;
    }
    .fingering-info .current-note {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .fingering-info .note-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* 演练控制条 */
    .play-controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }
    .btn-step {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn-step:hover { background: #475569; }
    .btn-step.active { background: var(--accent); }

    /* SVG 样式 */
    .sax-key {
      fill: var(--key-inactive);
      stroke: #64748b;
      stroke-width: 1.5;
      transition: fill 0.15s ease, stroke 0.15s ease;
    }
    .sax-key.active {
      fill: var(--key-active);
      stroke: #ffffff;
      filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.8));
    }
    .sax-label {
      font-size: 10px;
      fill: #94a3b8;
      text-anchor: middle;
      user-select: none;
    }

    /* 节拍器与打卡 */
    .metronome-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] { flex: 1; accent-color: var(--primary); }
    .btn-action {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-checkin {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-checkin:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎷 Saxophone Daily</h1>
      <p>今日五线谱视奏 & 动态指法同步教学</p>
    </header>

    <!-- 乐器模式 -->
    <div class="card">
      <div class="selector-group">
        <button class="btn-toggle active" id="btnAlto" onclick="setSax('alto')">中音萨克斯 (Eb)</button>
        <button class="btn-toggle" id="btnSoprano" onclick="setSax('soprano')">高音萨克斯 (Bb)</button>
      </div>
      <div style="font-size: 0.82rem; color: var(--text-muted); text-align: center;">
        五线谱与指法按统一的萨克斯本位移调记谱（视谱即吹）
      </div>
    </div>

    <!-- 五线谱与指法联动面板 -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.15rem;" id="taskTitle">今日主修音阶</h2>
        <span style="font-size: 0.85rem; color: var(--primary); font-weight: bold;" id="todayDate"></span>
      </div>

      <!-- 五线谱渲染容器 -->
      <div id="sheetMusicContainer"></div>

      <!-- 萨克斯动态指法图 -->
      <div class="fingering-wrapper">
        <div class="fingering-info">
          <div class="current-note" id="noteDisplay">C4</div>
          <div class="note-desc" id="noteDescDisplay">中音 1 (Do)</div>
          <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">高亮橙色即为按下按键</div>
        </div>

        <!-- 萨克斯按键布局 SVG -->
        <svg width="150" height="260" viewBox="0 0 150 260">
          <!-- 萨克斯管身中线 -->
          <line x1="75" y1="10" x2="75" y2="250" stroke="#1e293b" stroke-width="4" stroke-dasharray="2 2" />

          <!-- 左手拇指：泛音高音键 (Octave Key) -->
          <rect id="key_octave" class="sax-key" x="25" y="15" width="22" height="12" rx="3" />
          <text class="sax-label" x="36" y="40">高音键(8)</text>

          <!-- 左手食指中指无名指 1, 2, 3 -->
          <circle id="key_lh1" class="sax-key" cx="75" cy="55" r="11" />
          <text class="sax-label" x="75" y="59">B(1)</text>

          <circle id="key_lh2" class="sax-key" cx="75" cy="85" r="11" />
          <text class="sax-label" x="75" y="89">A(2)</text>

          <circle id="key_lh3" class="sax-key" cx="75" cy="115" r="11" />
          <text class="sax-label" x="75" y="119">G(3)</text>

          <!-- 左手小指 G# 侧键 -->
          <rect id="key_lh_gis" class="sax-key" x="100" y="110" width="16" height="12" rx="3" />
          <text class="sax-label" x="124" y="120">G#</text>

          <!-- 右手食指中指无名指 4, 5, 6 -->
          <circle id="key_rh1" class="sax-key" cx="75" cy="155" r="11" />
          <text class="sax-label" x="75" y="159">F(4)</text>

          <circle id="key_rh2" class="sax-key" cx="75" cy="185" r="11" />
          <text class="sax-label" x="75" y="189">E(5)</text>

          <circle id="key_rh3" class="sax-key" cx="75" cy="215" r="11" />
          <text class="sax-label" x="75" y="219">D(6)</text>

          <!-- 右手小指低音键 (低音 C / Eb) -->
          <rect id="key_rh_c" class="sax-key" x="100" y="218" width="16" height="10" rx="3" />
          <text class="sax-label" x="124" y="227">低音C</text>
        </svg>
      </div>

      <!-- 逐音点亮互动控制 -->
      <div class="play-controls">
        <button class="btn-step" onclick="prevNote()">◀ 上一个音</button>
        <button class="btn-step" id="btnAutoPlay" onclick="toggleAutoPlay()">▶ 慢速指法演示</button>
        <button class="btn-step" onclick="nextNote()">下一个音 ▶</button>
      </div>
    </div>

    <!-- 简易节拍器 -->
    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 10px;">🎧 节拍器辅助</h2>
      <div class="metronome-controls">
        <span id="bpmDisplay" style="font-weight: bold; width: 65px;">80 BPM</span>
        <input type="range" id="bpmSlider" min="50" max="150" value="80" oninput="updateBPM(this.value)">
        <button class="btn-action" id="btnMetronome" onclick="toggleMetronome()">启动</button>
      </div>
    </div>

    <!-- 打卡区 -->
    <div class="card" style="text-align: center;">
      <div style="font-size: 1.05rem; margin-bottom:
