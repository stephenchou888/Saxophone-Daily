name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 设置权限以允许发布到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：自动取消上一次未完成的旧构建，防止任务卡死或堆积
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Pack
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 限制最长10分钟，彻底杜绝无限卡住挂起
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不强制要求 cache，避免无 package-lock.json 时报错中断

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build project
        run: npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
